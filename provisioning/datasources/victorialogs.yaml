apiVersion: 1

datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: ${GRAFANA_VL_DATASOURCE_URL}
    basicAuth: true
    basicAuthUser: ${GRAFANA_VL_BASIC_AUTH_USER}
    secureJsonData:
      basicAuthPassword: ${GRAFANA_VL_BASIC_AUTH_PASSWORD}
    jsonData:
      maxLines: 2000000
    editable: true
