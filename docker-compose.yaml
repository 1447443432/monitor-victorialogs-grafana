services:
  hap-monitor-logs:
    image: registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-monitor-victorialogs-grafana-amd64:1.1.0
    container_name: hap-monitor-logs
    restart: always
    ports:
      # VictoriaLogs API
      - "9428:9428"
      # Grafana
      - "3000:3000"
    # 持久化
    volumes:
      # VictoriaLogs 数据目录
      - /data/victorialogs:/data/victorialogs
      # Grafana 数据目录
      - /data/grafana:/usr/local/grafana/data
    environment:
      # VictoriaLogs HTTP Basic Auth；Alloy 写入时使用同一账号（生产环境必改）
      MONITOR_AUTH_USERNAME: myuser
      MONITOR_AUTH_PASSWORD: mypassword
      # 外部访问 URL（反向代理/子路径时修改）
      GRAFANA_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/privatedeploy/mdy/monitor/victorialogs-grafana/"
      # 与 GRAFANA_SERVER_ROOT_URL 联动：URL 含子路径为 true，根路径为 false
      GRAFANA_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana管理员账号（生产环境必改）
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: admin@123456
    # 资源限制
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 102400
        hard: 102400
    # 日志
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
